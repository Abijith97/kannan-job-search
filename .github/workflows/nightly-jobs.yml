name: Nightly job refresh
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 India time, every day
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nightly-job-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check official employer listings in the five states
        run: node scripts/refresh-jobs.mjs
      - name: Save refreshed listings and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/job-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official job listings'
          git push
          gh workflow run website.yml --ref main
