name: Nightly job refresh
on:
  schedule:
    - cron: '30 20 * * *' # 02:00 India time, every day
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: nightly-job-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Search the five states using the resume and check employer listings
        id: refresh
        continue-on-error: true
        run: node scripts/refresh-jobs.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Save refreshed listings and deploy
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/job-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official job listings'
          git push
          gh workflow run website.yml --ref main
      - name: Report a failed profile search
        if: steps.refresh.outcome == 'failure'
        run: |
          echo '::error::Profile discovery failed. Check the refresh log; earlier jobs and the daily attempt ledger were preserved.'
          exit 1
